<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage One Rupee Toss</title>
  <style>
    :root {
      /* Background gradient: Deeper, prestigious tones (Deep Gold/Teal) */
      --bg: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      
      /* Coin Face Color Palettes */
      --coin-heads-base: linear-gradient(135deg, #d4af37 0%, #8c6d1d 100%); /* Gold/Bronze heads */
      --coin-tails-base: linear-gradient(135deg, #c0c0c0 0%, #696969 100%); /* Silver/Pewter tails */
      
      /* UI Colors */
      --accent-color: #6366f1; /* Modern decision purple */
      --button-hover: #4f46e5;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Glassmorphism Container */
    .app-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 320px;
    }

    h1 {
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 2rem;
      font-size: 1.5rem;
      text-transform: uppercase;
      opacity: 0.8;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 3D Coin Styling and Animation */
    .scene {
      width: 170px;
      height: 170px;
      margin: 0 auto 2.5rem;
      perspective: 1000px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 2s cubic-bezier(0.15, 0, 0.15, 1);
    }

    /* High-Definition Coin Faces (CSS only, no images needed) */
    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.3), 0 0 20px rgba(0,0,0,0.5);
      border: 8px solid rgba(255,255,255,0.15);
    }

    /* HEADS: The Ashoka Lion Capitol */
    .heads {
      background: var(--coin-heads-base);
      color: #3b2001; /* Deep bronze/brown */
    }

    /* TAILS: The One Rupee Denomination */
    .tails {
      background: var(--coin-tails-base);
      color: #111827; /* Near black silver */
      transform: rotateY(180deg);
    }

    /* Specific Iconography for Clarified Result */
    .coin-icon {
      font-size: 4rem; /* Large, bold icons */
      line-height: 1;
      font-weight: 900;
    }

    .coin-label {
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 8px;
      opacity: 0.8;
    }

    /* Result Text Animation */
    #result-text {
      font-size: 1.8rem;
      font-weight: 800;
      min-height: 2.2rem;
      margin-bottom: 2rem;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #result-text.show {
      opacity: 1;
      transform: scale(1.05);
      /* Result ceremony 'decision glow' */
      text-shadow: 0 0 25px var(--accent-color);
    }

    /* Button Styling with Pulse Animation */
    .btn-toss {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 1.2rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 1.2rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
    }

    .btn-toss:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.5);
      background-color: var(--button-hover);
    }

    .btn-toss:active {
      transform: translateY(0) scale(0.98);
    }

    .pulse {
      animation: pulse-animation 2s infinite;
    }

    @keyframes pulse-animation {
      0% { box-shadow: 0 0 0 0px rgba(99, 102, 241, 0.4); }
      70% { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0px rgba(99, 102, 241, 0); }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h1>DECISION COIN</h1>
    
    <div class="scene">
      <div class="coin" id="coin">
        <div class="face heads">
          <div class="coin-icon">&#129413;</div> <div class="coin-label">HEADS</div>
        </div>
        <div class="face tails">
          <div class="coin-icon">&#49;</div> <div class="coin-label">TAILS</div>
        </div>
      </div>
    </div>

    <div id="result-text">HEADS</div>

    <button class="btn-toss" id="tossBtn" onclick="flipCoin()">TOSS COIN</button>
  </div>

  <script>
    const coin = document.getElementById('coin');
    const resultText = document.getElementById('result-text');
    const tossBtn = document.getElementById('tossBtn');
    let isFlipping = false;

    function flipCoin() {
      if (isFlipping) return; // Prevent double clicks
      
      isFlipping = true;
      tossBtn.disabled = true;
      
      // Hide old result and reset button state
      resultText.classList.remove('show');
      tossBtn.classList.remove('pulse');

      const isHeads = Math.random() < 0.5;
      
      // Random extra rotations (between 8 and 13 full spins)
      const spins = Math.floor(Math.random() * 5) + 8;
      const degrees = isHeads ? (spins * 360) : (spins * 360 + 180);

      coin.style.transition = 'transform 2s cubic-bezier(0.15, 0, 0.15, 1)';
      coin.style.transform = `rotateY(${degrees}deg)`;

      // Ceremony timeout: Wait for spin to finish
      setTimeout(() => {
        // Show new clarified result with animation
        resultText.textContent = isHeads ? 'IT\'S HEADS!' : 'IT\'S TAILS!';
        // Head results are warm (Gold), Tails are cool (Silver)
        resultText.style.color = isHeads ? '#fbbf24' : '#cbd5e1';
        resultText.classList.add('show');

        // Update Button Context
        tossBtn.textContent = 'TOSS AGAIN';
        tossBtn.classList.add('pulse');
        tossBtn.disabled = false;
        isFlipping = false;

        // Reset the rotation counter quietly so it doesn't spin backwards next time
        // but keeps the visual side shown.
        const finalRotation = isHeads ? 0 : 180;
        coin.style.transition = 'none';
        coin.style.transform = `rotateY(${finalRotation}deg)`;
      }, 2000);
    }
  </script>
</body>
</html>
